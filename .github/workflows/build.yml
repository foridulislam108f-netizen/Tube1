name: Build My Tube APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p _src
          unzip -q -o Tube.zip -d _src
          GRADLEW=$(find _src -name gradlew -not -path '*/.git/*' | head -1)
          if [ -z "$GRADLEW" ]; then echo "gradlew not found in zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "VER_NAME=1.5.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VER_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace \
            -PverName=${{ env.VER_NAME }} \
            -PverCode=${{ env.VER_CODE }} \
            -PgithubRepo=${{ github.repository }}

      - name: Rename APK
        run: cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk" "MyTube-v${{ env.VER_NAME }}.apk"

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-apk
          path: MyTube-v${{ env.VER_NAME }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER_NAME }}
          name: My Tube v${{ env.VER_NAME }}
          body: "My Tube v${{ env.VER_NAME }}"
          files: MyTube-v${{ env.VER_NAME }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
